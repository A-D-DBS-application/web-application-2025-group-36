{% extends "base.html" %}
{% block content %}

<div class="auth-container">
  <div class="auth-card">

    <h2 class="auth-title">
      Create Your Account
    </h2>

    <form method="post">

      <div class="form-group">
        <label class="form-label" for="name">Name</label>
        <input
          type="text"
          id="name"
          name="name"
          required
          class="form-control"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          class="form-control"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="role">Role</label>
        <select
          id="role"
          name="role"
          required
          class="form-control"
        >
          <option value="" disabled selected>
            -- Select your role --
          </option>

          {% for value, label in user_roles %}
            <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>

        <small class="form-text text-muted">
          Select the role that best describes your primary function.
        </small>
      </div>

      <button type="submit" class="btn btn-primary btn-full">
        Create Account
      </button>

    </form>

    <div class="auth-footer">
      Already have an account?
      <a href="{{ url_for('main.login') }}" class="auth-link">
        Login here
      </a>
    </div>

  </div>
</div>

{% endblock %}
