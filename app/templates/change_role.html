{% extends "base.html" %}
{% block content %}

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="auth-card">

        <h2 class="auth-title">
          Change Your Role
        </h2>

        <form method="post" id="change-role-form">

          <div class="form-group">
            <label class="form-label" for="role">New role</label>

            <select
              id="role"
              name="role"
              required
              class="form-select"
            >
              <option value="" disabled>
                -- Select a role --
              </option>

              {% for role in roles %}
                <option
                  value="{{ role }}"
                  {% if user.role == role %}selected{% endif %}
                >
                  {{ role }}
                </option>
              {% endfor %}
            </select>
          </div>

          <input type="hidden" name="admin_password" id="admin_password_hidden">

          <button type="submit" class="btn btn-primary w-100">
            Update role
          </button>

        </form>

      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="adminModal" tabindex="-1" aria-labelledby="adminModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="adminModalLabel">Enter access password</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="mb-3">This role is restricted. Please enter the access password to continue.</p>
        <input
          type="password"
          id="admin_password_modal"
          class="form-control"
          placeholder="Password"
        >
        <div id="admin_modal_error" class="text-danger small mt-2 d-none">
          Password is required for this role.
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="admin_modal_confirm">Confirm</button>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("change-role-form");
    const roleSelect = document.getElementById("role");
    const hiddenPassword = document.getElementById("admin_password_hidden");
    const modalElement = document.getElementById("adminModal");
    const modal = new bootstrap.Modal(modalElement);
    const modalInput = document.getElementById("admin_password_modal");
    const modalError = document.getElementById("admin_modal_error");
    const modalConfirm = document.getElementById("admin_modal_confirm");
    const restrictedRoles = ["Founder", "System/Admin"];

    let pendingSubmit = false;

    function openModal() {
      modalInput.value = "";
      modalError.classList.add("d-none");
      modal.show();
      setTimeout(() => modalInput.focus(), 150);
    }

    modalElement.addEventListener("hidden.bs.modal", function () {
      modalInput.value = "";
    });

    modalConfirm.addEventListener("click", function () {
      const pwd = (modalInput.value || "").trim();
      if (!pwd) {
        modalError.classList.remove("d-none");
        return;
      }
      hiddenPassword.value = pwd;
      pendingSubmit = true;
      modal.hide();
      form.submit();
    });

    form.addEventListener("submit", function (e) {
      if (pendingSubmit) {
        pendingSubmit = false;
        return;
      }
      const selectedRole = roleSelect.value;
      const requiresPassword = restrictedRoles.includes(selectedRole);
      const alreadySet = (hiddenPassword.value || "").trim().length > 0;
      if (requiresPassword && !alreadySet) {
        e.preventDefault();
        openModal();
      }
    });
  });
</script>

{% endblock %}
