{% extends "base.html" %}
{% block content %}

<div class="auth-container">
  <div class="auth-card">

    <h2 class="auth-title">
      Change Your Role
    </h2>

    <form method="post">

      <div class="form-group">
        <label class="form-label" for="role">New role</label>

        <select
          id="role"
          name="role"
          required
          class="form-control"
        >
          <option value="" disabled>
            -- Select a role --
          </option>

          {% for role in roles %}
            <option
              value="{{ role }}"
              {% if user.role == role %}selected{% endif %}
            >
              {{ role }}
            </option>
          {% endfor %}
        </select>
      </div>

      <button type="submit" class="btn btn-primary btn-full">
        Update role
      </button>

    </form>

  </div>
</div>

{% endblock %}
